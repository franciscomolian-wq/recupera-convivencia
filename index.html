<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recupera Convivencia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { font-family: 'Roboto', system-ui, sans-serif; margin: 0; }
      /* Botones Material "contained": elevación en reposo, se eleva al hover, se aplana al presionar */
      .mbtn { box-shadow: 0 1px 3px rgba(60,64,67,.35), 0 4px 8px 3px rgba(60,64,67,.15) !important;
              transition: box-shadow .2s ease, filter .2s ease; letter-spacing: .15px; }
      .mbtn:hover { box-shadow: 0 2px 5px rgba(60,64,67,.35), 0 7px 14px 5px rgba(60,64,67,.18) !important; filter: brightness(1.05); }
      .mbtn:active { box-shadow: 0 1px 3px rgba(60,64,67,.35) !important; filter: brightness(.96); }
      .mbtn:disabled { box-shadow: none !important; }
      /* Botón Material "outlined": leve elevación en reposo, más al hover */
      .mbtn-outline { transition: box-shadow .2s ease, background .2s ease; box-shadow: 0 1px 2px rgba(60,64,67,.20), 0 1px 3px 1px rgba(60,64,67,.10) !important; }
      .mbtn-outline:hover { box-shadow: 0 1px 3px rgba(60,64,67,.30), 0 4px 8px 3px rgba(60,64,67,.15) !important; background: #F8FAFD; }
      .mbtn-outline:disabled { box-shadow: none !important; }
      /* Ítems del menú lateral: hover suave (solo en los no-activos) */
      .nav-item { transition: background .15s ease; }
      .nav-item:hover { background: rgba(26,115,232,0.07); }
      @media print {
        aside, .print\:hidden { display: none !important; }
        main { padding: 0 !important; }
        * { box-shadow: none !important; }
        body { background: #fff !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
